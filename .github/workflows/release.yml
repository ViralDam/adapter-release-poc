name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize releases queue-style. Never cancel an in-flight publish — npm has no
# transaction across N packages, so a half-released version set is unrecoverable.
concurrency:
  group: release
  cancel-in-progress: false

# Default to nothing; each job opts in to exactly what it needs.
permissions: {}

jobs:
  release:
    name: version or stage
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # changesets pushes the version commit and git tags
      pull-requests: write # ...and opens/updates the "version packages" PR
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # staged publishing needs Node >= 22.14.0
          registry-url: https://registry.npmjs.org

      # The runner's bundled npm is routinely too old: trusted publishing needs
      # >= 11.5.1 and staged publishing needs >= 11.15.0.
      - name: Pin a new enough npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - run: npm run build

      # Opens/updates the "version packages" PR when changesets are pending.
      # Note there is no `publish:` input — `changeset publish` shells out to
      # `npm publish`, which a staging-only trusted publisher refuses. Staging
      # is handled by the next step instead.
      - name: Create or update release PR
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stages any workspace whose version is absent from the registry. A staged
      # version sits in the registry but is NOT installable until a human runs
      # `npm stage approve` with 2FA — CI structurally cannot approve its own
      # release, because shortlived OIDC tokens may not run `npm stage` at all.
      - name: Stage unpublished versions
        run: node scripts/stage-publish.mjs
