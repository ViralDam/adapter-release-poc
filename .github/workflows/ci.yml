name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded CI runs — the opposite of the release workflow's setting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

      # Prove the tarballs are well-formed before anything tries to publish them.
      - name: Pack every workspace
        run: npm pack --workspaces --pack-destination /tmp/packs

      - name: Show tarball contents
        run: for t in /tmp/packs/*.tgz; do echo "== $t"; tar -tzf "$t"; done
