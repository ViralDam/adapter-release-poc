name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded CI runs — the opposite of the release workflow's setting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

      # Prove the tarballs are well-formed before anything tries to publish them.
      # `--pack-destination` does NOT create the directory — npm just opens the
      # output path and fails ENOENT if the parent is missing.
      - name: Pack every workspace
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          npm pack --workspaces --pack-destination "$RUNNER_TEMP/packs"

      - name: Show tarball contents
        run: |
          shopt -s nullglob
          packs=("$RUNNER_TEMP"/packs/*.tgz)
          if [ ${#packs[@]} -eq 0 ]; then
            echo "no tarballs were produced" >&2
            exit 1
          fi
          for t in "${packs[@]}"; do
            echo "== $(basename "$t")"
            tar -tzf "$t"
          done
